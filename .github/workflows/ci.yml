name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - walking-skeleton

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install locked dependencies
        env:
          CMAKE_ARGS: -DGGML_NATIVE=OFF
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: uv sync --project backend --frozen

      - name: Check formatting
        working-directory: backend
        run: uv run ruff format --check src tests ../scripts/scan-secrets.py

      - name: Lint
        working-directory: backend
        run: uv run ruff check src tests ../scripts/scan-secrets.py

      - name: Test
        working-directory: backend
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --prefix frontend

      - name: Check formatting
        working-directory: frontend
        run: npm run check

      - name: Test
        run: npm test --prefix frontend

      - name: Build
        run: npm run build --prefix frontend

      - name: Scan the production bundle
        run: python3 scripts/scan-secrets.py --extra frontend/dist

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan tracked files
        run: python3 scripts/scan-secrets.py
